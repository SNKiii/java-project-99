name: SonarQube
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/**/*.gradle*') }}

      - name: Make gradlew executable
        working-directory: app
        run: chmod +x gradlew

      - name: Compile only (skip tests)
        working-directory: app
        run: ./gradlew compileJava compileTestJava -x test

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: app
        run: ./gradlew sonar -x test -x build \
          -Dsonar.coverage.exclusions="**/dto/**, **/config/**, **/exception/**" \
          -Dsonar.java.binaries=build/classes/java/main