services:
  - type: web
    name: java-project-99
    runtime: image
    repo: https://github.com/SNKiii/java-project-99
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: app-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: app-db
          property: password
    buildCommand: ./gradlew bootJar
    startCommand: java -jar build/libs/app-0.0.1-SNAPSHOT.jar

databases:
  - name: app-db
    plan: free
    databaseName: app_db
    user: app_user